name: sync-upstream
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  actions: write
jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: upstream
      - name: fast forward from upstream
        run: |
          git remote add upstream https://github.com/KangelPlugins/Plugins-Store.git
          git fetch upstream main
          git checkout upstream
          git merge --ff-only upstream/main
      - name: try push
        run: |
          if git diff --quiet origin/upstream upstream; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin upstream
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/mirror.yml/dispatches \
            -d '{"ref":"main"}'
