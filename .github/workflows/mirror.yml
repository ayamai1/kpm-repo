name: mirror
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  miror:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: update
        run: |
          git remote add upstream-store https://github.com/KangelPlugins/Plugins-Store.git
          git fetch upstream-store main
          git show upstream-store/main:store.json > store.json
          python convert.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          printf '%s' "$(git rev-parse upstream-store/main)" > UPSTREAM_COMMIT_HASH
          git add UPSTREAM_COMMIT_HASH
          git diff --cached --quiet || git commit -m "ci: update plugins.json"
          git push origin main
